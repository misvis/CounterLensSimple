<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=https://misvis.github.io/counterlens-simple/">
  <link rel="canonical" href="https://misvis.github.io/counterlens-simple/">
  <title>CounterLens has moved</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e7e9f2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #252a35 0, #0f1117 55%);
    }
    main {
      width: min(520px, 100%);
      padding: 32px;
      text-align: center;
      border: 1px solid #444b5b;
      border-radius: 20px;
      background: rgba(25, 28, 36, 0.96);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }
    .mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(242, 199, 92, 0.14);
      color: #f2c75c;
      font-size: 24px;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 22px; color: #b9bfce; line-height: 1.6; }
    a {
      display: inline-flex;
      padding: 10px 16px;
      border-radius: 12px;
      background: #78b7ff;
      color: #0f1117;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
  <script>
    (() => {
      const legacyPrefix = '/CounterLensSimple/';
      const suffix = location.pathname.startsWith(legacyPrefix)
        ? location.pathname.slice(legacyPrefix.length)
        : '';
      const target = new URL('/counterlens-simple/' + suffix, location.origin);
      target.search = location.search;
      target.hash = location.hash;
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌁</div>
    <h1>CounterLens has moved</h1>
    <p>Redirecting you to the new lowercase address.</p>
    <a href="https://misvis.github.io/counterlens-simple/">Continue to CounterLens</a>
  </main>
</body>
</html>
